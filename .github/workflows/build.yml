name: Build

# Run when tags are pushed or manually
on:
  workflow_dispatch:
  push:
    tags:
      - '*'

# contents: write is required to publish artifacts,
# packages: write is required to push container images.
# https://goreleaser.com/ci/actions/#token-permissions
permissions:
  contents: write
  packages: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      # Tags are not covered by the branch triggers in ci.yml, so this job must
      # gate itself: never publish a binary that does not pass its own tests.
      - name: Test
        run: go test -race -count=1 ./...

      - name: Go lint
        run: |
          go install golang.org/x/lint/golint@latest
          golint .

      - name: Staticcheck
        # Same toolchain split as ci.yml: staticcheck 0.8.x requires go >= 1.26
        # to compile, while the release build itself stays on the 1.25.x declared
        # in go.mod. `go install pkg@ver` builds in the tool's own module graph,
        # so escalating GOTOOLCHAIN here does not change what gets shipped.
        # Pinned, not @latest: an unpinned lint release can turn a release red
        # without a code change. ./... not `.` -- the root-only scope is how a
        # data race in controllers/ went unnoticed.
        env:
          GOTOOLCHAIN: go1.26.0
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...

      - name: Install goversioninfo
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
